<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07010f">
  <title>NEON RUSH 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div class="fx-vignette"></div>
  <div class="fx-scanlines"></div>
  <div id="flash"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-block">
      <div class="label">ОЧКИ</div>
      <div id="score" class="value">0</div>
      <div id="best-hud" class="sub">РЕКОРД 0</div>
    </div>
    <div class="hud-block center">
      <div id="zone" class="zone">ЗОНА 1 · SYNTHWAVE</div>
      <div id="shield" class="shield hidden">◆ ЩИТ АКТИВЕН</div>
    </div>
    <div class="hud-block right">
      <div class="label">МНОЖИТЕЛЬ</div>
      <div id="mult" class="value pink">x1</div>
      <div class="sub"><span id="speed">0</span> КМ/Ч</div>
    </div>
  </div>
  <div id="zone-banner"></div>
  <div id="hint" class="hint-float hidden">← → полоса · ↑ / Пробел прыжок</div>
  

  <!-- MENU -->
  <div id="menu" class="screen">
    <h1 class="title"><span class="t1">NEON</span><span class="t2">RUSH</span></h1>
    <p class="tagline">Бесконечный полёт сквозь неоновый горизонт</p>
    <button id="play-btn" class="btn">ИГРАТЬ</button>
    <div class="best">РЕКОРД: <span id="best-menu">0</span></div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen hidden">
    <h2 class="h2">ПАУЗА</h2>
    <button id="resume-btn" class="btn">ПРОДОЛЖИТЬ</button>
    <p class="hint">P / Esc</p>
  </div>

  <!-- GAME OVER -->
  <div id="over" class="screen hidden">
    <h2 class="h2 glitch" data-text="GAME OVER">GAME OVER</h2>
    <div id="new-record" class="new-record hidden">★ НОВЫЙ РЕКОРД ★</div>
    <div class="stats">
      <div><span>Очки</span><b id="final-score">0</b></div>
      <div><span>Дистанция</span><b id="final-dist">0 м</b></div>
      <div><span>Кристаллы</span><b id="final-crystals">0</b></div>
      <div><span>Рекорд</span><b id="final-best">0</b></div>
    </div>
    <div class="row">
      <button id="restart-btn" class="btn">ЕЩЁ РАЗ</button>
      <button id="menu-btn" class="btn ghost">МЕНЮ</button>
    </div>
    <p class="hint">Enter или Пробел, чтобы начать заново</p>
  </div>

  <button id="mute-btn" class="icon-btn" title="Звук (M)" aria-label="Звук">♪</button>
  <script src="game.js"></script>
</body>
</html>
